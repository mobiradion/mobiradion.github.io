<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Star | Favorites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body data-page="favorites">
  <div class="page-shell">
    <div data-include="header"></div>
    <main class="inner-main">
      <section class="station-section">
        <div class="section-heading section-heading-with-action">
          <h2>Favorite Stations</h2>
          <button id="clear-favorites" class="secondary-btn clear-favorites-btn" type="button">Clear Favorites</button>
        </div>
        <div id="favorites-list" class="radio-grid">
          <p class="loading-state">Loading favorite stations...</p>
        </div>
      </section>
    </main>
    <div data-include="footer"></div>
  </div>
  <script src="shared.js"></script>
  <script src="favorites-storage.js"></script>
  <script src="favorites.js"></script>
