<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Star | Telugu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body data-page="telugu">
  <div class="page-shell">
    <div data-include="header"></div>
    <main class="inner-main">
      <section class="station-section">
        <div class="section-heading">
          <h2>Telugu Stations</h2>
        </div>
        <div class="search-bar-wrap">
          <label class="sr-only" for="radio-search">Search Telugu radios</label>
          <input
            id="radio-search"
            class="radio-search"
            type="search"
            placeholder="Search Telugu radios..."
            autocomplete="off"
          >
        </div>
        <div id="radio-list" class="radio-grid">
          <p class="loading-state">Loading Telugu radio stations...</p>
        </div>
         
      </section>
    </main>
    <div data-include="footer"></div>
  </div>
  <script src="shared.js"></script>
  <script src="telugu-data.js"></script>
  <script src="language-page.js"></script>
   <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6870612281681959"
              crossorigin="anonymous"></script>
            <!-- radiostar.in -->
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6870612281681959" data-ad-slot="8202292755"
              data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>
              (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
</body>
</html>
